[package]
name = "atlas"
version = "0.1.0"
description = "Atlas — a modern, fast, cross-platform file explorer"
authors = ["Atlas contributors"]
edition = "2024"
license = "MIT"

[lib]
# The `_lib` suffix keeps the lib name unique from the bin name (Windows quirk, cargo#8519).
name = "atlas_lib"
# Desktop-only app: rlib is all the binary needs (staticlib/cdylib are for mobile targets).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat", "io"] }
futures = "0.3"
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
dirs = "6"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
mime_guess = "2"
bytes = "1"
log = "0.4"
once_cell = "1"
sysinfo = { version = "0.37", default-features = false, features = ["disk"] }
trash = "5"
notify = "8"
notify-debouncer-full = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico", "tiff"] }
sha2 = "0.10"
hex = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
opendal = { version = "0.54", default-features = false, features = [
  "executors-tokio",
  "services-s3",
  "services-gdrive",
  "services-webdav",
  "services-ftp",
  "services-memory",
] }
russh = { version = "0.54", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
urlencoding = "2"
base64 = "0.22"
rand = "0.9"
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
